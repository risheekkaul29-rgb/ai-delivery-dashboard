# Validates the dashboard on every push. Does NOT deploy and needs no secrets.
# Deployment is handled by Cloudflare Pages watching this repo — see README.

name: Validate dashboard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract and syntax-check the embedded script
        run: |
          python3 - <<'PY'
          import re, sys
          html = open('index.html', encoding='utf-8').read()
          blocks = re.findall(r'<script[^>]*>(.*?)</script>', html, re.S)
          if not blocks:
              sys.exit('No <script> block found in index.html')
          open('/tmp/dash.js', 'w').write(blocks[0])
          print(f'Extracted {len(blocks[0])} chars')
          PY
          node --check /tmp/dash.js
          echo "JS syntax OK"

      - name: Check client data structure
        run: |
          node -e "
          const fs = require('fs');
          const h = fs.readFileSync('index.html', 'utf8');
          const i = h.indexOf('const clients = {');
          if (i === -1) { console.error('clients object not found'); process.exit(1); }
          const j = h.indexOf('\n};', i);
          const clients = eval('(' + h.slice(i + 16, j + 2) + ')');
          const required = ['name','statusLabel','owner','briefing','modules','timeline','risks','jiraLinks'];
          let bad = 0;
          for (const [k, c] of Object.entries(clients)) {
            required.forEach(f => { if (!(f in c)) { console.error('MISSING', k, f); bad++; } });
            c.modules.forEach(m => { if (!m.name || !m.status) { console.error('BAD MODULE', k); bad++; } });
            c.timeline.forEach(t => { if (!t.title || !t.date || !t.type) { console.error('BAD TIMELINE', k, t.title); bad++; } });
            c.risks.forEach(r => { if (!r.icon || !r.text) { console.error('BAD RISK', k); bad++; } });
          }
          console.log('Clients:', Object.keys(clients).length);
          if (bad) process.exit(1);
          console.log('Structure OK');
          "

      - name: Check tag balance
        run: |
          python3 - <<'PY'
          import sys
          h = open('index.html', encoding='utf-8').read()
          ok = True
          for tag in ('div', 'tr', 'td', 'section'):
              o, c = h.count(f'<{tag}'), h.count(f'</{tag}>')
              status = 'ok' if o == c else 'MISMATCH'
              if o != c: ok = False
              print(f'{tag}: {o} open / {c} close  {status}')
          sys.exit(0 if ok else 1)
          PY

      - name: Warn on stale date language
        run: |
          python3 - <<'PY'
          import re
          h = open('index.html', encoding='utf-8').read()
          allow = ('Available Today', 'sponsors today', 'manually today')
          hits = [m for m in re.findall(r'.{60}\btoday\b.{60}', h, re.I)
                  if not any(a.lower() in m.lower() for a in allow)]
          if hits:
              print(f'::warning::{len(hits)} possible stale "today" reference(s):')
              for m in hits[:10]:
                  print('  ...' + m.replace('\n', ' ') + '...')
          else:
              print('No stale "today" references.')
          PY
